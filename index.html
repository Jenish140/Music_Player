<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>
<body>

    <div class="player-container">
        <div class="img-container">
            <img src="images/cover1.jpg" alt="Album Art" id="cover">
        </div>
        <h2 id="title">Song Title</h2>
        <h3 id="artist">Artist Name</h3>

        <audio src="music/song1.mp3" id="audio"></audio>
        <audio src="music/song2.mp3" id="audio"></audio>
        <audio src="music/song3.mp3" id="audio"></audio>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="controls">
            <button id="prev" class="control-btn">
                <i class="fas fa-backward"></i>
            </button>
            <button id="play" class="control-btn play-btn">
                <i class="fas fa-play"></i>
            </button>
            <button id="next" class="control-btn">
                <i class="fas fa-forward"></i>
            </button>
        </div>

        <div class="volume-container">
            <i class="fas fa-volume-down"></i>
            <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volume-slider">
            <i class="fas fa-volume-up"></i>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
